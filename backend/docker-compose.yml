version: "3.9"

services:
  api:
    image: sohammmmmmmm/skillsync-backend
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
      - prometheus
    env_file:
      - .env
    volumes:
      - .:/app
    networks:
      - monitoring

  db:
    image: ankane/pgvector:latest
    # container_name: ${DB_CONTAINER}
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    # ports:
    #   - "${DB_PORT}:5432"
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - monitoring

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - monitoring


networks:
  monitoring:

volumes:
  db_data:

